name: run all tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]

    runs-on: ${{ matrix.os }}
    name: run tests
    steps:
      - uses: actions/checkout@v4
      - name: python
        uses: actions/setup-python@v5
        with:
            python-version: ${{ matrix.python-version }}
            architecture: ${{ matrix.os == 'macos-15' && 'arm64' || 'x64' }}
      - name: install requirements
        run: |
          pip install wheel
          pip install mypy
          pip install .
      - name: mypy
        run: |
          mypy --config-file mypy.ini openglider
      - name: test
        run: |
          python tests/testall.py
