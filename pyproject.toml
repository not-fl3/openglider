[build-system]
requires = ["setuptools>=69", "setuptools-rust>=1.12", "pybind11>=2.11", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools-rust]

[[tool.setuptools-rust.ext-modules]]
target = "openglider.rs"
path = "Cargo.toml"
binding = "PyO3"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "mypy>=1.0",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
