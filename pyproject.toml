[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openglider"
dynamic = ["version"]
description = "A python library for paraglider design"
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-3.0-or-later"
authors = [
    { name = "airG products", email = "simon@airg.family" }
]
keywords = ["paraglider", "flying"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "euklid",
    "pyfoil",
    "pydantic",
    "svgwrite",
    "numpy",
    "scipy",
    "ezdxf",
    "ezodf",
    "lxml",
    "pyexcel-ods",
    "packaging",
    "meshpy",
    "svglib",
]

[project.optional-dependencies]
gui = [
    "qtpy",
    "pyside6",
    "qtawesome",
    "qasync",
    "qtmodern",
    "qtconsole",
    "pyqtgraph",
    "matplotlib",
    "vtk",
]

[project.scripts]
openglider = "openglider.gui:start_main_window"

[project.urls]
Homepage = "https://www.openglider.org"
Repository = "https://github.com/booya-at/OpenGlider"

[tool.hatch.version]
path = "openglider/version.py"
pattern = "(?s).*__version__\\s*=\\s*['\"](?P<version>[^'\"]+)['\"].*"

[tool.hatch.build.targets.wheel]
packages = ["openglider"]

[tool.hatch.build.targets.wheel.force-include]
"openglider/py.typed" = "openglider/py.typed"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "mypy>=1.0",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
