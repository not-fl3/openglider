[build-system]
requires = ["setuptools>=69", "setuptools-rust>=1.12", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools-rust]

dependencies = [
    "euklid",
    "pyfoil",
    "pydantic",
    "svgwrite",
    "numpy",
    "scipy",
    "ezdxf",
    "ezodf",
    "lxml",
    "pyexcel-ods",
    "packaging",
    "meshpy",
    "svglib",
]

[project.optional-dependencies]
gui = [
    "qtpy",
    "pyside6",
    "qtawesome",
    "qasync",
    "qtmodern",
    "qtconsole",
    "pyqtgraph",
    "matplotlib",
    "vtk",
]

[project.scripts]
openglider = "openglider.gui:start_main_window"

[project.urls]
Homepage = "https://www.openglider.org"
Repository = "https://github.com/booya-at/OpenGlider"

[tool.setuptools]
packages = ["openglider"]

[tool.setuptools-rust]
[[tool.setuptools-rust.ext-modules]]
target = "openglider.rs"
path = "Cargo.toml"
binding = "PyO3"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "mypy>=1.0",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
