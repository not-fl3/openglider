[package]
name = "openglider-rs"
version = "0.1.3"
edition = "2021"

[lib]
name = "rs"
path = "rust/lib.rs"
crate-type = ["cdylib"]

[[bin]]
name = "pyo3_stub_gen"
path = "rust/stub_gen.rs"

[dependencies]
anyhow = "1"
pyo3 = { version = "0.29", features = ["experimental-inspect"] }
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
pyo3-introspection = "0.29"

[profile.release]
opt-level = 3
lto = "fat"        # or "thin" for faster compile times
codegen-units = 1  # enables better cross-module optimization
panic = "abort"    # if you don't need unwinding
strip = true       # smaller binary
